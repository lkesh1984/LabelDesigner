<div class="designer-header d-flex align-items-center justify-content-between px-3 py-2">
  <!-- LEFT: editable label -->
  <div class="left-area d-flex align-items-center gap-2 flex-shrink-0">
    <input *ngIf="isEditingName"
       [focusWhen]="isEditingName"
           [(ngModel)]="labelName"
           (blur)="saveLabelName()"
           (keydown)="handleKeyDown($event)"
           class="form-control form-control-sm label-input" />
    
    <div *ngIf="!isEditingName"
         class="d-flex align-items-center gap-1 label-display-wrapper"
         (click)="enableEditing()"
         style="cursor:pointer;">
      <h5 class="mb-0 fw-semibold label-display">{{ labelName }}</h5>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
           class="edit-icon" viewBox="0 0 16 16">
        <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 
                 0 0 1 0 .708l-9.5 9.5L4 13l.646-2.354 
                 9.5-9.5zM11.207 2L13 3.793 14.793 2 
                 13 0.207 11.207 2zM4.5 13.5 1 15l1.5-3.5 
                 L4.5 13.5z" />
      </svg>
    </div>
  </div>

  <!-- CENTER: shape toolbar -->
  <div class="center-area flex-grow-1 d-flex justify-content-center">
    <div class="shape-group d-flex gap-2" role="toolbar">
      <button type="button"
              class="shape-item btn-reset"
              [class.selected]="selectedShape === WidgetType.Text"
              (click)="selectShape(WidgetType.Text)"
              title="Text">
        <svg viewBox="0 0 100 100" width="30" height="30">
          <text x="50" y="60" text-anchor="middle" font-size="60" font-family="Arial" fill="black">T</text>
        </svg>
      </button>

      <button type="button"
              class="shape-item btn-reset"
              [class.selected]="selectedShape === WidgetType.Rectangle"
              (click)="selectShape(WidgetType.Rectangle)"
              title="Rectangle">
        <!-- Replace with your <RectangleSvg /> -->
        <svg viewBox="0 0 100 100" width="30" height="30">
          <rect x="10" y="20" width="80" height="60" fill="none" stroke="black" />
        </svg>
      </button>

      <button type="button"
              class="shape-item btn-reset"
              [class.selected]="selectedShape === WidgetType.Barcode"
              (click)="selectShape(WidgetType.Barcode)"
              title="Barcode">
        <!-- Replace with <BarcodeSvg /> -->
        <svg viewBox="0 0 100 100" width="30" height="30">
          <rect x="10" y="20" width="80" height="60" fill="none" stroke="black" stroke-dasharray="3 3" />
        </svg>
      </button>

      <button type="button"
              class="shape-item btn-reset"
              [class.selected]="selectedShape === WidgetType.Circle"
              (click)="selectShape(WidgetType.Circle)"
              title="Circle">
        <!-- Replace with <CircleSvg /> -->
        <svg viewBox="0 0 100 100" width="30" height="30">
          <circle cx="50" cy="50" r="30" fill="none" stroke="black" />
        </svg>
      </button>

      <button type="button"
              class="shape-item btn-reset"
              [class.selected]="selectedShape === WidgetType.Line"
              (click)="selectShape(WidgetType.Line)"
              title="Line">
        <!-- Replace with <LineSvg /> -->
        <svg viewBox="0 0 100 100" width="30" height="30">
          <line x1="10" y1="90" x2="90" y2="10" stroke="black" />
        </svg>
      </button>
    </div>
  </div>

  <!-- RIGHT: close -->
  <div class="right-area flex-shrink-0">
    <button type="button" class="btn-close" aria-label="Close" (click)="closeDesigner()"></button>
  </div>
</div>
