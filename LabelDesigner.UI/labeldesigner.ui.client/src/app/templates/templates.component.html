<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">My Templates</h4>
  <!-- Search Box -->
  <div class="position-relative" style="width: 220px;">
  <input type="text"
         class="form-control form-control-sm pe-4"
         placeholder="Search templates..."
         [(ngModel)]="searchText"
         (input)="filterTemplates()" />

  <!-- X icon (clear button) -->
<button *ngIf="searchText"
          type="button"
          class="btn btn-sm position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent p-0 me-2"
          (click)="clearSearch()">
    ×
  </button>
</div>
  <app-designer-modal *ngIf="showDesigner" [isOpen]="showDesigner" [templateId]="templateId" [templateSvg]="templateSvg"
    [fabricJson]="fabricJson" [templateName]="templateName" [templateVersionId]="templateVersionId"
    [template]="template" (closeDesignerEvent)="closeDesigner($event)"
    (templateSavedEvent)="savedTemplate($event)"></app-designer-modal>
  <!-- Add New Button -->
  <button class="add-new-btn" (click)="openDesigner()">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-plus-circle"
      viewBox="0 0 16 16">
      <path d="M8 15A7 7 0 1 0 8 1a7 7 0 0 0 0 14m0-1A6 6 0 1 1 8 2a6 6 0 0 1 0 12" />
      <path d="M8 4a.5.5 0 0 1 .5.5V7.5h3a.5.5 0 0 1 0 1h-3V11a.5.5
               0 0 1-1 0V8.5H4a.5.5 0 0 1 0-1h3V4.5A.5.5 0 0 1 8 4" />
    </svg>
    Add New
  </button>
</div>

             0 0 0-.4-.2H4.98zM1 6.5V6l4.22-5h5.56L15 6v.5h-4.5a.5.5 0 0 0-.5.5v2a.5.5

  <h5>No Templates Found</h5>
  <p class="mb-3">Start by creating your first template.</p>
  <button class="btn btn-outline-primary" (click)="openDesigner()">+ Create Template</button>
</div>

<!-- Request Payload Modal -->
<div *ngIf="isRequestPayload" class="modal-backdrop show modal-backdrop-blur"></div>
<div class="modal fade show d-block" tabindex="-1" *ngIf="isRequestPayload">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Generate PDF with Sample Data</h5>
        <button type="button" class="btn-close" (click)="isRequestPayload = false"></button>
      </div>
      <div class="modal-body">
        <!-- Request Payload Section -->
        <div class="mb-3">
          <h6 class="fw-bold">Request Payload</h6>
          <pre class="bg-light p-2 rounded small" style="max-height: 200px; overflow:auto;">
      {{ requestPayloadData | json }}
          </pre>
        </div>
        <h6 class="fw-bold mb-2">Test</h6>
        <form (ngSubmit)="submitRequestPayload()" #payloadForm="ngForm">
          <div *ngFor="let record of requestPayloadData.records; let i = index" class="widget-grid">
            <div *ngFor="let widget of record.templateWidgets; let j = index" class="widget-box"
              [ngClass]="{'barcode-widget': widget.widgetId.toLowerCase().includes('barcode')}">

              <label [for]="'widget-' + i + '-' + j" class="form-label fw-bold">{{widget.widgetId}}</label>

              <!-- Text input -->
              <input *ngIf="!widget.widgetId.toLowerCase().includes('barcode')" type="text" class="form-control"
                [(ngModel)]="widget.widgetValue" [name]="'widget-' + i + '-' + j" [id]="'widget-' + i + '-' + j"
                placeholder="Enter value" />

              <!-- Barcode input -->
              <div *ngIf="widget.widgetId.toLowerCase().includes('barcode')">
                <input type="text" class="form-control mb-1" [(ngModel)]="widget.widgetValue"
                  [name]="'widget-' + i + '-' + j" [id]="'input-' + i + '-' + j"
                  (input)="onBarcodeInput(widget, 'barcode-' + i + '-' + j)" placeholder="Enter barcode value" />
                <svg [id]="'barcode-' + i + '-' + j"></svg>
              </div>

            </div>
          </div>
          <button type="submit" class="btn btn-primary mt-2">Submit</button>
        </form>
      </div>
    </div>
  </div>

  <div *ngIf="isLoadingPdf" class="loading-overlay">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Generating PDF...</span>
    </div>
    <p>Generating PDF, please wait...</p>
  </div>
</div>
