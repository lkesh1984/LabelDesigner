<div class="properties-panel border-start ps-3 pe-3" style="width: 260px;">
  <h3 class="mb-3">Properties</h3>

  <ng-container *ngIf="selectedWidget; else noSelection">
    <div class="mb-3">
      <label class="form-label">Fill Color</label>
      <input
        type="color"
        class="form-control form-control-color"
        [(ngModel)]="selectedWidget.fillColor"
        (change)="onChange()" />
    </div>

    <div class="mb-3">
      <label class="form-label">Stroke Width</label>
      <input
        type="number"
        class="form-control"
        [(ngModel)]="selectedWidget.strokeWidth"
        (input)="onChange()"
        min="1"
        max="10" />
    </div>
  </ng-container>

  <ng-template #noSelection>
    <p class="text-muted">Select a shape to edit its properties</p>
  </ng-template>
</div>
